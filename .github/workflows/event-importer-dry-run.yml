name: Event importer dry run

on:
  workflow_dispatch:
    inputs:
      post_id:
        description: Optional TAT Newsroom post ID
        required: false
        type: string
      limit:
        description: Maximum number of events
        required: true
        default: "50"
        type: string

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: event_importer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: event_importer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Fetch and validate events without writing Firestore
        env:
          POST_ID: ${{ inputs.post_id }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=(--limit "$LIMIT")
          if [ -n "$POST_ID" ]; then
            args+=(--post-id "$POST_ID")
          fi
          npm run dry-run -- "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-importer-dry-run
          path: event_importer/dry-run-output.json
          if-no-files-found: warn
